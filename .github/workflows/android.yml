name: Android APK

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK
        if: github.event_name != 'push' || github.ref_type != 'tag'
        run: ./build.sh
      - name: Build signed release APK
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          COPY_DIRECT_LINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Set the ANDROID_RELEASE_KEYSTORE_BASE64 GitHub secret.}"
          umask 077
          export COPY_DIRECT_LINK_KEYSTORE="$(mktemp "$RUNNER_TEMP/copy-direct-link.XXXXXX")"
          trap 'rm -f -- "$COPY_DIRECT_LINK_KEYSTORE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$COPY_DIRECT_LINK_KEYSTORE"
          unset RELEASE_KEYSTORE_BASE64
          ./build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: copy-direct-link
          path: dist/copy-direct-link.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: copy-direct-link
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" copy-direct-link.apk --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
